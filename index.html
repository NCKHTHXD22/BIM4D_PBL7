<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Mô phỏng 4D - TTYT huyện Kỳ Sơn</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fc3e6;font-family:Arial,sans-serif}
canvas{display:block}
#title{position:fixed;left:24px;top:14px;color:#ffe800;font:bold 40px "Times New Roman",serif;text-shadow:2px 2px 4px #000;line-height:1.15;pointer-events:none}
#sub{position:fixed;right:28px;bottom:120px;color:#fff;font:bold 30px "Times New Roman",serif;text-shadow:2px 2px 5px #000;text-align:right;pointer-events:none;max-width:70%}

#legend{position:fixed;right:20px;top:16px;background:rgba(0,0,0,.45);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.7}
#legend i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border-radius:3px}
#ui{position:fixed;left:0;right:0;bottom:0;background:rgba(10,20,40,.78);color:#fff;padding:10px 18px}
#ui button{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:6px 12px;margin:2px;cursor:pointer;font-size:13px}
#ui button.sc{background:#2d3b55}
#ui input[type=range]{width:100%}
#row{display:flex;align-items:center;gap:12px}#date{font:bold 18px Arial;min-width:120px}
#scenes{max-height:64px;overflow:auto;margin-top:4px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1a33;color:#fff;font-size:22px;z-index:9}
body.rec #ui,body.rec #legend{display:none} body.rec #sub{bottom:40px}

<div id="load">Đang tải mô hình… <span id="lp"></span></div>
<div id="title">PBL7 - Nhóm 1<br><span style="font-size:30px">TTYT huyện Kỳ Sơn</span></div>
<div id="sub"></div>
<div id="legend"><b>CHÚ GIẢI</b><br><i style="background:#c9c6c0"></i>Bê tông<br><i style="background:#9c3d1c"></i>Cốt thép<br><i style="background:#c8913f"></i>Ván khuôn, cây chống<br><i style="background:#3aa35c"></i>Giàn giáo, lưới<br><i style="background:#b5522e"></i>Tường gạch → trát</div>
